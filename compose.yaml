x-credit-api: &credit-api
  environment:
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    BANK_A_BASE_URL: http://bank-a-mock-api:3001
    BANK_B_BASE_URL: http://bank-b-mock-api:3002
    BANK_TIMEOUT_SECONDS: ${BANK_TIMEOUT_SECONDS:-5}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bank-a-mock-api:
    build: ./bank-a-mock-api
    ports:
      - "127.0.0.1:${BANK_A_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bank-b-mock-api:
    build: ./bank-b-mock-api
    ports:
      - "127.0.0.1:${BANK_B_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3002/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *credit-api
    image: credit-simulation-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  credit-simulation-api:
    <<: *credit-api
    build: ./credit-simulation-api
    image: credit-simulation-api:local
    ports:
      - "127.0.0.1:${CREDIT_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bank-a-mock-api:
        condition: service_healthy
      bank-b-mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/simulations', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
    image: credit-simulation-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      credit-simulation-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  cleanup:
    <<: *credit-api
    image: credit-simulation-api:local
    pull_policy: never
    profiles: ["maintenance"]
    command: ["python", "-m", "app.cleanup"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
